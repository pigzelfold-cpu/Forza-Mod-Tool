name: .NET Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Project_Path: CondensedSource/FH6ModTool.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ${{ env.Project_Path }}

    - name: Build
      run: dotnet build ${{ env.Project_Path }} --no-restore -c ${{ matrix.configuration }}

    - name: Publish single-file Release
      if: matrix.configuration == 'Release'
      run: dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 --self-contained true -o publish

    - name: Upload build artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: Forza-Mod-Tool-win-x64
        path: publish
